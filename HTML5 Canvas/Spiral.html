<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Canvas spiral</title>
  <style>
    * {
  margin: 0 auto;
  font-family: Helvetica;
}
html {
  background-color: #e9e9e9;
    }
	canvas {
		border: 1px solid black;
	}
  </style>
</head>
<body>

  <canvas id="spiralCanvas" width="300" height="300"></canvas>    
  <canvas id="spiralCanvas2" width="400" height="400"></canvas>
  <canvas id="fibonacciCanvas" width="400" height="400"></canvas>

<script>
drawSpiral();
drawSpiral2();
drawSpiralFibonacci();

function drawSpiral() 
{
const canvas = document.getElementById('spiralCanvas');
const ctx = canvas.getContext('2d');
let radius = canvas.height / 2;
ctx.translate(radius, radius);
radius = radius * 0.90;

 for(let num = 0; num <= 1; num+=0.001)
	{
        let ang = num * Math.PI * 2;
        ctx.beginPath();
        ctx.rotate(ang);
        
        ctx.moveTo(0, -radius * num);
        ctx.lineTo(0, -radius * num + 1);
        ctx.strokeStyle = 'black';
        ctx.lineWidth = 1;
        ctx.stroke();
        
        ctx.rotate(-ang);
		console.log(-radius * num + 1);
    }
}


function drawSpiral2() 
{
    // Récupération du contexte du canvas
	const canvas = document.getElementById('spiralCanvas2');
	const ctx = canvas.getContext('2d');

	// Paramètres de la spirale
	const centerX = canvas.width / 2;
	const centerY = canvas.height / 2;
	const tours = 10;
	const pointsParTour = 100;

	// Dessin de la spirale
	ctx.beginPath();
	ctx.moveTo(centerX, centerY);

	for (let i = 0; i < tours * pointsParTour; i++) {
		const angle = 0.1 * i;
		const rayon = angle * 2;
		const x = centerX + rayon * Math.cos(angle);
		const y = centerY + rayon * Math.sin(angle);
		ctx.lineTo(x, y);
	}

	ctx.strokeStyle = 'black';
	ctx.stroke();   
}

	function drawSpiralFibonacci() 
	{
		const canvas = document.getElementById('fibonacciCanvas');
		const ctx = canvas.getContext('2d');

	 const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const scale = 5; // Facteur d'échelle pour agrandir la spirale
	
 let a = 1;
		let b = 1;
		let x = centerX;
		let y = centerY;
		let angle = Math.PI;

		ctx.beginPath();
		ctx.moveTo(x, y);

		for (let i = 0; i < 12; i++) {
			let temp = a;
			a = b;
			b = temp + b;

			let startX = x;
			let startY = y;

			for (let t = 0; t <= 90; t++) {
				let radian = (angle + t * Math.PI / 180) % (2 * Math.PI);
				x = startX + Math.cos(radian) * a * scale;
				y = startY + Math.sin(radian) * a * scale;
				ctx.lineTo(x, y);
			}

			angle += Math.PI / 2;
		}

		ctx.strokeStyle = 'blue';
		ctx.lineWidth = 2;
		ctx.stroke();
	}
</script>
</body>
</html>
