<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Canvas Clock</title>
  <style>
    * {
  margin: 0 auto;
  font-family: Helvetica;
}
html {
  background-color: #e9e9e9;
    }
  </style>
</head>
<body>

  <canvas id="clockCanvas" width="300" height="300"></canvas>    
<script>
const canvas = document.getElementById('clockCanvas');
const ctx = canvas.getContext('2d');
let radius = canvas.height / 2;
ctx.translate(radius, radius);
radius = radius * 0.90;

function drawClock() {
    drawFace(ctx, radius);
	// Call either drawHourMarkers or drawNumbers
    drawHourMarkers(ctx, radius);
    //drawNumbers(ctx, radius);
    drawTime(ctx, radius);
}

function drawFace(ctx, radius) {
    // Draw clock face (white circle)
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, 2 * Math.PI);
    ctx.fillStyle = 'white';
    ctx.fill();
    
    // Draw clock border (thick black circle)
    /*ctx.strokeStyle = 'black';
    ctx.lineWidth = radius * 0.1;
    ctx.stroke();*/
    
    // Draw center point (small black circle)
    ctx.beginPath();
    ctx.arc(0, 0, radius * 0.1, 0, 2 * Math.PI);
    ctx.fillStyle = 'black';
    ctx.fill();
}
  
  function drawNumbers(ctx, radius) {
    ctx.font = radius * 0.15 + "px arial";
    ctx.textBaseline = "middle";
    ctx.textAlign = "center";
    for(let num = 1; num <= 12; num++){
        let ang = num * Math.PI / 6;
        ctx.rotate(ang);
        ctx.translate(0, -radius * 0.85);
        ctx.rotate(-ang);
        // Draw each number
        ctx.fillText(num.toString(), 0, 0);
        ctx.rotate(ang);
        ctx.translate(0, radius * 0.85);
        ctx.rotate(-ang);
    }
}

function drawHourMarkers(ctx, radius) {
    for(let num = 1; num <= 12; num++){
        let ang = num * Math.PI / 6;
        ctx.beginPath();
        ctx.rotate(ang);
        
        // Draw hour marker (small line)
        ctx.moveTo(0, -radius * 0.95);
        ctx.lineTo(0, -radius * 0.85);
        ctx.strokeStyle = 'black';
        ctx.lineWidth = radius * 0.02;
        ctx.stroke();
        
        ctx.rotate(-ang);
    }
}

function drawTime(ctx, radius){
    const now = new Date();
    let hour = now.getHours();
    let minute = now.getMinutes();
    let second = now.getSeconds();
    
    // Calculate hour hand position
    hour = hour%12;
    hour = (hour*Math.PI/6) + (minute*Math.PI/(6*60)) + (second*Math.PI/(360*60));
    drawHand(ctx, hour, radius*0.5, radius*0.07);
    
    // Calculate minute hand position
    minute = (minute*Math.PI/30) + (second*Math.PI/(30*60));
    drawHand(ctx, minute, radius*0.8, radius*0.07);
    
    // Calculate second hand position
    second = (second*Math.PI/30);
    drawHand(ctx, second, radius*0.9, radius*0.02);
}

function drawHand(ctx, pos, length, width) {
    // Draw a clock hand
    ctx.beginPath();
    ctx.lineWidth = width;
    ctx.lineCap = "round";
    ctx.moveTo(0,0);
    ctx.rotate(pos);
    ctx.lineTo(0, -length);
    ctx.stroke();
    ctx.rotate(-pos);
}

// Update clock every second
setInterval(drawClock, 1000);
</script>
</body>
</html>
